<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Sprint</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container { width: 100%; max-width: 400px; text-align: center; }

        .card {
            background: var(--tg-theme-secondary-bg-color, #2c2c2e);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .word-display {
            font-size: 28px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #50a8eb);
            margin-bottom: 5px;
        }

        .hint-text { font-size: 13px; opacity: 0.6; }

        /* Поле вводу (+8 балів) */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #444;
            background: #333;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus { border-color: #50a8eb; }

        .send-btn {
            background: #ffa502;
            color: black;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .separator {
            margin: 10px 0;
            font-size: 12px;
            opacity: 0.4;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .separator::before, .separator::after {
            content: ""; height: 1px; background: #555; flex-grow: 1; margin: 0 10px;
        }

        /* Кнопки (+1 бал) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: var(--tg-theme-button-color, #50a8eb);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:active { transform: scale(0.96); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .timer-bar {
            width: 100%; height: 4px; background: #444; border-radius: 2px;
            margin-bottom: 15px; overflow: hidden;
        }
        .timer-fill { height: 100%; background: #ff4757; width: 100%; transition: width 1s linear; }

        .correct { background-color: #2ed573 !important; }
        .wrong { background-color: #ff4757 !important; animation: shake 0.4s; }

        .points-float {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            animation: floatUp 0.8s forwards;
            pointer-events: none;
        }

        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        #endScreen { display: none; }
        .result-score { font-size: 60px; font-weight: bold; margin: 20px 0; color: #2ed573; }
        .main-btn {
            width: 100%; padding: 15px; background: var(--tg-theme-button-color, #50a8eb);
            color: white; border: none; border-radius: 12px; font-size: 18px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="gameScreen">
        <div class="top-bar">
            <span>🏆 <span id="scoreVal">0</span></span>
            <span>⏱️ <span id="timeVal">60</span>s</span>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="timer"></div></div>

        <div class="card">
            <div class="word-display" id="questionWord">...</div>
            <div class="hint-text">⌨️ Введи (+8) або 👇 Натисни (+1)</div>
        </div>

        <div class="input-area">
            <input type="text" id="ansInput" placeholder="Введи переклад..." autocomplete="off">
            <button class="send-btn" onclick="checkInput()">➜</button>
        </div>

        <div class="separator">АБО</div>

        <div class="options-grid" id="options"></div>
    </div>

    <div class="container" id="endScreen">
        <h1>Час вийшов!</h1>
        <p>Твій результат:</p>
        <div class="result-score" id="finalScore">0</div>
        <button class="main-btn" onclick="sendResult()">💾 Зберегти прогрес</button>
        <button class="main-btn" style="background: #444;" onclick="location.reload()">🔄 Ще раз</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const demoWords = [
        {w: "Apple", t: "Яблуко"}, {w: "Car", t: "Машина"}, {w: "House", t: "Будинок"},
        {w: "Friend", t: "Друг"}, {w: "Time", t: "Час"}, {w: "Work", t: "Робота"}
    ];

    let wordDatabase = [];
    let score = 0;
    let timeLeft = 60;
    let currentWord = {};
    let timerInt;
    let correctWordsList = [];

    // --- АЛГОРИТМ НЕЧІТКОГО ПОШУКУ (FUZZY MATCHING) ---
    function levenshteinDistance(a, b) {
        a = a.toLowerCase().trim();
        b = b.toLowerCase().trim();
        
        if (a.length > b.length) {
            let tmp = a; a = b; b = tmp;
        }
        
        let prev = Array.from({length: a.length + 1}, (_, i) => i);
        let curr = new Array(a.length + 1);

        for (let j = 1; j <= b.length; j++) {
            curr[0] = j;
            for (let i = 1; i <= a.length; i++) {
                if (a[i - 1] === b[j - 1]) {
                    curr[i] = prev[i - 1];
                } else {
                    curr[i] = 1 + Math.min(
                        prev[i],      // видалення
                        curr[i - 1],  // вставка
                        prev[i - 1]   // заміна
                    );
                }
            }
            let tmp = prev; prev = curr; curr = tmp;
        }
        return prev[a.length];
    }

    function calculateSimilarity(a, b) {
        let maxLen = Math.max(a.length, b.length);
        if (maxLen === 0) return 1.0;
        return 1.0 - (levenshteinDistance(a, b) / maxLen);
    }
    // ---------------------------------------------------

    function loadWordsFromUrl() {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const dataStr = urlParams.get('data');

            if (dataStr) {
                const decoded = decodeURIComponent(dataStr);
                const words = JSON.parse(decoded);
                if (Array.isArray(words) && words.length >= 4) {
                    wordDatabase = words;
                } else {
                    throw new Error("Not enough words");
                }
            } else {
                throw new Error("No data");
            }
        } catch (e) {
            console.log("Using demo words:", e.message);
            wordDatabase = demoWords;
            tg.showAlert("Демо-режим. Додайте більше слів у боті!");
        }
    }

    function startGame() {
        loadWordsFromUrl();
        score = 0; timeLeft = 60; correctWordsList = [];
        updateUI();
        nextRound();

        timerInt = setInterval(() => {
            timeLeft--;
            updateUI();
            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextRound() {
        document.getElementById('ansInput').value = '';
        document.getElementById('ansInput').focus();

        const idx = Math.floor(Math.random() * wordDatabase.length);
        currentWord = wordDatabase[idx];

        let opts = new Set([currentWord.t]);
        let attempts = 0;
        while(opts.size < 4 && attempts < 50) {
            const rand = wordDatabase[Math.floor(Math.random()*wordDatabase.length)];
            if(rand.t !== currentWord.t) opts.add(rand.t);
            attempts++;
        }
        
        // Заглушки якщо мало слів
        const placeholders = ["Слово", "Тест", "Інше", "Питання"];
        let p = 0;
        while(opts.size < 4) opts.add(placeholders[p++] || "???");

        document.getElementById('questionWord').innerText = currentWord.w;
        const div = document.getElementById('options');
        div.innerHTML = '';

        Array.from(opts).sort(()=>Math.random()-0.5).forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkOption(btn, opt);
            div.appendChild(btn);
        });
    }

    // ОНОВЛЕНА ФУНКЦІЯ: Перевірка вводу через схожість
    function checkInput() {
        const val = document.getElementById('ansInput').value.trim();
        if (!val) return;

        const correct = currentWord.t;
        let sim = calculateSimilarity(val, correct);

        // Динамічне нарахування балів залежно від точності
        if (sim === 1.0) {
            success(8, true); // Ідеально (+8 балів)
        } else if (sim >= 0.8) {
            success(5, true); // Одна опечатка (+5 балів)
        } else if (sim >= 0.6) {
            success(2, true); // Кілька помилок, але близько (+2 бали)
        } else {
            failInput();      // Зовсім неправильно
        }
    }

    function checkOption(btn, val) {
        if (val === currentWord.t) {
            btn.classList.add('correct');
            success(1, false);
        } else {
            btn.classList.add('wrong');
            tg.HapticFeedback.notificationOccurred('error');
        }
    }

    function success(pts, isHard) {
        score += pts;
        if (!correctWordsList.includes(currentWord.w)) {
            correctWordsList.push(currentWord.w);
        }
        tg.HapticFeedback.notificationOccurred('success');
        showAnim(pts, isHard);
        updateUI();
        setTimeout(nextRound, isHard ? 400 : 200);
    }

    function failInput() {
        tg.HapticFeedback.notificationOccurred('error');
        const el = document.getElementById('ansInput');
        el.style.borderColor = '#ff4757';
        setTimeout(()=>el.style.borderColor = '#444', 400);
    }

    function showAnim(pts, isHard) {
        const el = document.createElement('div');
        el.className = 'points-float';
        el.innerText = `+${pts}`;
        // Жовтий колір для тексту (складно), зелений для кнопок (легко)
        el.style.color = isHard ? '#ffa502' : '#2ed573'; 
        const card = document.querySelector('.card');
        const rect = card.getBoundingClientRect();
        el.style.left = (rect.left + rect.width/2 - 10) + 'px';
        el.style.top = rect.top + 'px';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 800);
    }

    function updateUI() {
        document.getElementById('scoreVal').innerText = score;
        document.getElementById('timeVal').innerText = timeLeft;
        document.getElementById('timer').style.width = (timeLeft/60*100) + '%';
    }

    function endGame() {
        clearInterval(timerInt);
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('endScreen').style.display = 'block';
        document.getElementById('finalScore').innerText = score;
    }

    function sendResult() {
        const data = JSON.stringify({
            type: 'game_result',
            score: score,
            learned_words: correctWordsList
        });
        tg.sendData(data);
    }

    document.getElementById('ansInput').addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkInput();
    });

    startGame();
</script>
</body>
</html>
